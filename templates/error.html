{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
<div class="error-page">
  <div class="code">{{ status }}</div>
  <h1>{{ message }}</h1>
  <p>Nothing was changed. You can go back to the dashboard and continue.</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard') }}"><svg class="icon"><use href="#i-grid"/></svg>Back to Dashboard</a>
</div>
{% endblock %}
