{% extends "base.html" %}
{% block title %}Security Logs{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Security logs</h1>
    <p>Every authentication attempt is recorded automatically.</p>
  </div>
  <button class="btn btn-danger" id="btnClearLogs"><svg class="icon"><use href="#i-trash"/></svg>Clear Logs</button>
</div>

<div class="card">
  <div class="row filters" style="margin-bottom:16px">
    <div class="seg" id="resultFilter">
      <button data-value="all" class="active">All</button>
      <button data-value="success">Successful</button>
      <button data-value="failed">Failed</button>
    </div>
    <select id="deviceFilter" aria-label="Filter by device"><option value="">All devices</option></select>
    <span class="spacer"></span>
    <span class="card-sub" id="logCount"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Time</th><th>Device</th><th>Challenge</th><th>Result</th><th>Method</th><th>Details</th></tr></thead>
      <tbody id="logsBody"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}
